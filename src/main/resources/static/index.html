<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Oficina Central - Mi Factoría Web</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<h1>🥩 Parrilla El Tano - Reservas</h1>
<form action="/reservar" method="post">
    <input type="text" name="clienteNombre" placeholder="Tu Nombre" required><br>
    <input type="number" name="cantidadPersonas" placeholder="Personas" required><br>
    <input type="datetime-local" name="fechaHora" required><br>
    <input type="text" name="telefono" placeholder="WhatsApp / Teléfono" required><br>
    <button type="submit">Reservar Mesa</button>
</form>
</body>
</html>
