<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reserva Exitosa - El Tano</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
            url('https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: #333;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { color: #d32f2f; margin-bottom: 10px; }
        p { margin-bottom: 30px; line-height: 1.5; }
        .btn-home {
            background-color: #d32f2f;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-home:hover { background-color: #b71c1c; }
    </style>
</head>
<body>
<div class="card">
    <h1>✅ ¡Todo listo!</h1>
    <p>Tu reserva en <strong>Parrilla El Tano</strong> ha sido registrada exitosamente. ¡Te esperamos para disfrutar del mejor asado!</p>
    <a href="/" class="btn-home">Volver al Inicio</a>
</div>
<script th:src="@{/js/main.js}" defer></script>
</body>
</html>
