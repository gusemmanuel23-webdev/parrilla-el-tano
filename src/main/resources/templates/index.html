<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Parrilla El Tano</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<a th:href="@{/login}" class="admin-link">Acceso Personal</a>

<div class="reserva-container">
    <h1>🥩 El Tano</h1>

    <div th:if="${sistemaAbierto}">
        <p>Reservá tu mesa y vení a disfrutar de la mejor parrilla argentina.</p>

        <form th:action="@{/reservar}" method="post" th:object="${reserva}">

            <div th:if="${mensajeExito}" class="success-msg">
                <p th:text="${mensajeExito}"></p>
            </div>

            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" th:field="*{clienteNombre}" placeholder="Ej: Juan Pérez" required>
                <p th:if="${#fields.hasErrors('clienteNombre')}" th:errors="*{clienteNombre}" class="error-msg"></p>
            </div>

            <div class="form-group">
                <label>Cantidad de Personas</label>
                <input type="number" th:field="*{cantidadPersonas}" min="1" max="20" required>
                <p th:if="${#fields.hasErrors('cantidadPersonas')}" th:errors="*{cantidadPersonas}" class="error-msg"></p>
            </div>

            <div class="form-group">
                <label>Fecha y Hora</label>
                <input type="datetime-local" th:field="*{fechaHora}" id="fechaReserva" required>
                <p th:if="${#fields.hasErrors('fechaHora')}" th:errors="*{fechaHora}" class="error-msg"></p>
            </div>

            <div class="form-group">
                <label>Teléfono / WhatsApp</label>
                <input type="tel" th:field="*{telefono}" placeholder="Ej: 11 2233 4455" required>
                <p th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" class="error-msg"></p>
            </div>

            <button type="submit" class="btn-reservar">CONFIRMAR RESERVA</button>
        </form>
    </div>

    <div th:unless="${sistemaAbierto}" class="aviso-cerrado">
        <h2>⚠️ Salón Lleno</h2>
        <p>Por el momento no estamos tomando más reservas por la web para este turno.</p>
        <p><strong>Consultá disponibilidad llamando al:</strong><br>
            <span style="font-size: 1.2rem; color: white;">011 4444-5555</span></p>
    </div>

    <div class="footer-info">
        📍 Av. Principal 123, Buenos Aires<br>
        📞 011 4444-5555
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
