<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Parrilla El Tano</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">

<div class="login-card">
  <h2>Acceso Admin</h2>

  <div th:if="${param.error}" class="error-msg">
    ⚠️ Usuario o contraseña incorrectos.
  </div>
  <div th:if="${param.logout}" class="logout-msg">
    ✓ Has cerrado sesión correctamente.
  </div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" name="username" placeholder="Ingresá tu usuario" required autofocus>
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login">INGRESAR</button>
  </form>

  <div style="margin-top: 20px;">
    <a th:href="@{/}" class="back-link">← Volver al Inicio Público</a>
  </div>

  <p style="margin-top: 25px; font-size: 11px; color: var(--text-muted); letter-spacing: 1px;">
    PARRILLA EL TANO © 2026
  </p>
</div>

<script th:src="@{/js/main.js}" defer></script>
</body>
</html>
