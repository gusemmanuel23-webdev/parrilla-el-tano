<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Parrilla El Tano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --tano-red: #b22222;
            --tano-dark: #1a1a1a;
            --tano-gold: #d4af37;
        }
        body { background-color: #f4f4f4; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Navbar con estilo */
        .navbar { background-color: var(--tano-dark); border-bottom: 3px solid var(--tano-red); }
        .navbar-brand { font-weight: bold; letter-spacing: 1px; color: white !important; }

        /* Cards y Layout */
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-header { background-color: var(--tano-dark); color: white; border-radius: 12px 12px 0 0 !important; padding: 15px 20px; }

        /* Botón de Pánico / Sistema */
        .status-container { background: white; padding: 20px; border-radius: 12px; border-left: 8px solid var(--tano-red); }
        .btn-panic { font-weight: 800; padding: 12px; border-radius: 8px; transition: 0.3s; text-transform: uppercase; }

        /* Tabla de Reservas */
        .table { vertical-align: middle; }
        .table thead { background-color: #eeeeee; }
        .badge-status { padding: 8px 12px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; }

        /* Botón WhatsApp corregido */
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            text-decoration: none;
        }
        .btn-whatsapp:hover { background-color: #128c7e; transform: scale(1.1); color: white; }

        /* Estilos de inputs */
        .form-control:focus { border-color: var(--tano-red); box-shadow: 0 0 0 0.25rem rgba(178, 34, 34, 0.25); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="fas fa-fire"></i> PARRILLA EL TANO <span class="text-muted fw-light">| Admin</span></a>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-light btn-sm" type="submit"><i class="fas fa-sign-out-alt"></i> Salir</button>
        </form>
    </div>
</nav>

<div class="container">

    <div class="row">
        <div class="col-lg-4">
            <div class="status-container shadow-sm mb-4">
                <h6 class="text-muted text-uppercase small fw-bold">Estado de Reservas</h6>
                <form th:action="@{/admin/toggle-sistema}" method="post" class="mt-3">
                    <button type="submit"
                            th:class="${sistemaAbierto} ? 'btn btn-danger btn-panic w-100' : 'btn btn-success btn-panic w-100'">
                        <i th:class="${sistemaAbierto} ? 'fas fa-door-closed me-2' : 'fas fa-door-open me-2'"></i>
                        <span th:text="${sistemaAbierto} ? 'Cerrar Recepción' : 'Abrir Recepción'"></span>
                    </button>
                </form>
            </div>

            <div class="card text-center p-4">
                <h6 class="text-muted text-uppercase small fw-bold">Total Comensales</h6>
                <h1 class="display-4 fw-bold" style="color: var(--tano-red)" th:text="${total}">0</h1>
                <p class="text-muted small mb-0" th:text="${fechaSeleccionada != null ? 'Para el día ' + fechaSeleccionada : 'En total seleccionado'}"></p>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card p-3 mb-4">
                <form th:action="@{/admin}" method="get" class="row g-3 align-items-end">
                    <div class="col-md-7">
                        <label class="form-label small fw-bold">Filtrar por fecha específica:</label>
                        <input type="date" name="fecha" class="form-control" th:value="${fechaSeleccionada}">
                    </div>
                    <div class="col-md-5">
                        <div class="btn-group w-100">
                            <button type="submit" class="btn btn-dark">Filtrar</button>
                            <a th:href="@{/admin}" class="btn btn-outline-secondary">Limpiar</a>
                        </div>
                    </div>
                </form>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-clipboard-list me-2"></i> Listado de Reservas</span>
                    <span class="badge bg-danger" th:text="${#lists.size(reservas)}">0</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th class="ps-4">Cliente</th>
                                <th>Gente</th>
                                <th>Fecha / Hora</th>
                                <th>Contacto</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="r : ${reservas}">
                                <td class="ps-4">
                                    <div class="fw-bold" th:text="${r.clienteNombre}">Nombre</div>
                                    <span th:classappend="${r.estado == 'PENDIENTE' ? 'badge bg-warning text-dark' : (r.estado == 'CONFIRMADA' ? 'badge bg-success' : 'badge bg-secondary')}"
                                          class="badge-status" th:text="${r.estado}">PENDIENTE</span>
                                </td>
                                <td th:text="${r.cantidadPersonas}">0</td>
                                <td class="small">
                                    <i class="far fa-calendar-alt text-muted"></i> <span th:text="${#temporals.format(r.fechaHora, 'dd/MM')}"></span><br>
                                    <i class="far fa-clock text-muted"></i> <span th:text="${#temporals.format(r.fechaHora, 'HH:mm')}"></span>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <span class="small me-2" th:text="${r.telefono}">1234</span>
                                        <a th:href="'https://wa.me/54' + ${r.telefono} + '?text=Hola%20' + ${r.clienteNombre} + ',%20te%20escribimos%20de%20Parrilla%20El%20Tano%20por%20tu%20reserva%20para%20el%20día%20' + ${#temporals.format(r.fechaHora, 'dd/MM')}"
                                           target="_blank" class="btn-whatsapp">
                                            <i class="fab fa-whatsapp"></i>
                                        </a>
                                    </div>
                                </td>
                                <td class="pe-4">
                                    <div class="btn-group">
                                        <form th:action="@{/admin/confirmar/{id}(id=${r.id})}" method="post">
                                            <button class="btn btn-sm btn-outline-success border-0" title="Confirmar"><i class="fas fa-check"></i></button>
                                        </form>
                                        <form th:action="@{/admin/eliminar/{id}(id=${r.id})}" method="post">
                                            <button class="btn btn-sm btn-outline-danger border-0" title="Eliminar" onclick="return confirm('¿Eliminar reserva?')">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(reservas)}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <i class="fas fa-info-circle d-block mb-2 fa-2x"></i>
                                    No hay reservas para la fecha seleccionada.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
