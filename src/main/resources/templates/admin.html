<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrador - El Tano</title>
    <style>
        :root {
            --rojo-tano: #d32f2f;
            --negro-carbon: #212121;
            --gris-claro: #f4f4f4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--gris-claro);
            margin: 0;
            padding: 0;
        }

        /* Barra de navegación / Header */
        header {
            background-color: var(--negro-carbon);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .user-info { display: flex; align-items: center; gap: 15px; }

        .btn-logout {
            background-color: var(--rojo-tano);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-logout:hover { background-color: #b71c1c; }

        /* Contenido Principal */
        .container { padding: 20px; max-width: 1200px; margin: auto; }

        h1 { text-align: center; color: var(--negro-carbon); }

        /* Tarjeta de Resumen */
        .stats-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            border-left: 8px solid var(--rojo-tano);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: fit-content;
            margin: 20px auto;
            text-align: center;
        }

        /* Tabla */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }

        th { background-color: var(--rojo-tano); color: white; text-transform: uppercase; font-size: 0.9rem; }

        tr:hover { background-color: #f9f9f9; }

        /* Estados y Acciones */
        .status-confirmada { color: #2e7d32; font-weight: bold; }
        .status-pendiente { color: #ef6c00; font-weight: bold; }
        .status-cancelada { color: #c62828; font-weight: bold; }

        .actions a {
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-right: 5px;
            display: inline-block;
        }

        .btn-confirm { background: #e8f5e9; color: #2e7d32; border: 1px solid #2e7d32; }
        .btn-cancel { background: #ffebee; color: #c62828; border: 1px solid #c62828; }
        .btn-delete { background: #eee; color: #616161; border: 1px solid #616161; }

        footer { text-align: center; margin-top: 30px; padding-bottom: 30px; }
        .back-link { color: var(--rojo-tano); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <strong>Parrilla El Tano</strong> | Panel de Control
    </div>

    <div sec:authorize="isAuthenticated()" class="user-info">
        <span>Hola, <strong sec:authentication="name">Admin</strong></span>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn-logout">Cerrar Sesión</button>
        </form>
    </div>
</header>

<div class="container">
    <h1>Gestión de Reservas</h1>

    <div class="stats-card">
        <h3 style="margin: 0; color: #757575;">Total Comensales Hoy</h3>
        <p style="font-size: 32px; font-weight: bold; margin: 10px 0; color: var(--rojo-tano);" th:text="${total}">0</p>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Personas</th>
            <th>Fecha y Hora</th>
            <th>Teléfono</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservas}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.clienteNombre}"></td>
            <td th:text="${r.cantidadPersonas}"></td>
            <td th:text="${#temporals.format(r.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${r.telefono}"></td>
            <td>
                    <span th:text="${r.estado}"
                          th:class="${r.estado == 'CONFIRMADA' ? 'status-confirmada' : (r.estado == 'CANCELADA' ? 'status-cancelada' : 'status-pendiente')}">
                    </span>
            </td>
            <td class="actions">
                <a th:href="@{'/admin/estado/' + ${r.id} + '/CONFIRMADA'}" class="btn-confirm">Confirmar</a>
                <a th:href="@{'/admin/estado/' + ${r.id} + '/CANCELADA'}" class="btn-cancel">Cancelar</a>
                <a th:href="@{'/admin/eliminar/' + ${r.id}}" class="btn-delete"
                   onclick="return confirm('¿Eliminar esta reserva definitivamente?')">Borrar</a>
                <a th:href="'https://wa.me/54' + ${r.telefono} + '?text=Hola%20' + ${r.clienteNombre} + ',%20te%20escribo%20de%20Parrilla%20El%20Tano%20para%20confirmar%20tu%20reserva.'"
                   target="_blank"
                   class="btn btn-success btn-sm"
                   style="background-color: #25D366; border-color: #25D366; color: white; text-decoration: none;">
                    WhatsApp
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <footer>
        <a href="/" class="back-link">← Volver al Inicio Público</a>
    </footer>
</div>

</body>
</html>
