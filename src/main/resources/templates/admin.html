<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Parrilla El Tano</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="admin-body">

<nav class="navbar navbar-dark mb-4 admin-navbar">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="fas fa-fire"></i> PARRILLA EL TANO <span class="text-muted fw-light">| Admin</span></a>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-light btn-sm" type="submit"><i class="fas fa-sign-out-alt"></i> Salir</button>
        </form>
    </div>
</nav>

<div class="container">

    <div class="row">
        <div class="col-lg-4">
            <div class="status-container admin-card shadow-sm mb-4">
                <h6 class="text-muted text-uppercase small fw-bold">Estado de Reservas</h6>
                <form th:action="@{/admin/toggle-sistema}" method="post" class="mt-3">
                    <button type="submit"
                            th:class="${sistemaAbierto} ? 'btn btn-danger btn-panic w-100' : 'btn btn-success btn-panic w-100'">
                        <i th:class="${sistemaAbierto} ? 'fas fa-door-closed me-2' : 'fas fa-door-open me-2'"></i>
                        <span th:text="${sistemaAbierto} ? 'Cerrar Recepción' : 'Abrir Recepción'"></span>
                    </button>
                </form>
            </div>

            <div class="admin-card card text-center p-4">
                <h6 class="text-muted text-uppercase small fw-bold">Total Comensales</h6>
                <h1 class="display-4 fw-bold text-tano-red" th:text="${total}">0</h1>
                <p class="text-muted small mb-0" th:text="${fechaSeleccionada != null ? 'Para el día ' + fechaSeleccionada : 'En total seleccionado'}"></p>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="admin-card card p-3 mb-4">
                <form th:action="@{/admin}" method="get" class="row g-3 align-items-end">
                    <div class="col-md-7">
                        <label class="form-label small fw-bold">Filtrar por fecha específica:</label>
                        <input type="date" name="fecha" id="fechaFiltro" class="form-control admin-form-control" th:value="${fechaSeleccionada}">
                    </div>
                    <div class="col-md-5">
                        <div class="btn-group w-100">
                            <button type="submit" class="btn btn-dark">Filtrar</button>
                            <a th:href="@{/admin}" class="btn btn-outline-secondary">Limpiar</a>
                        </div>
                    </div>
                </form>
            </div>

            <div class="admin-card card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-clipboard-list me-2"></i> Listado de Reservas</span>
                    <span class="badge bg-danger" th:text="${#lists.size(reservas)}">0</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 admin-table">
                            <thead>
                            <tr>
                                <th class="ps-4">Cliente</th>
                                <th>Gente</th>
                                <th>Fecha / Hora</th>
                                <th>Contacto</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="r : ${reservas}">
                                <td class="ps-4">
                                    <div class="fw-bold" th:text="${r.clienteNombre}">Nombre</div>
                                    <span th:classappend="${r.estado == 'PENDIENTE' ? 'badge bg-warning text-dark' : (r.estado == 'CONFIRMADA' ? 'badge bg-success' : 'badge bg-secondary')}"
                                          class="badge-status" th:text="${r.estado}">PENDIENTE</span>
                                </td>
                                <td th:text="${r.cantidadPersonas}">0</td>
                                <td class="small">
                                    <i class="far fa-calendar-alt text-muted"></i> <span th:text="${#temporals.format(r.fechaHora, 'dd/MM')}"></span><br>
                                    <i class="far fa-clock text-muted"></i> <span th:text="${#temporals.format(r.fechaHora, 'HH:mm')}"></span>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <span class="small me-2" th:text="${r.telefono}">1234</span>
                                        <a th:href="'https://wa.me/54' + ${r.telefono} + '?text=Hola%20' + ${r.clienteNombre} + ',%20te%20escribimos%20de%20Parrilla%20El%20Tano%20por%20tu%20reserva%20para%20el%20día%20' + ${#temporals.format(r.fechaHora, 'dd/MM')}"
                                           target="_blank" class="btn-whatsapp">
                                            <i class="fab fa-whatsapp"></i>
                                        </a>
                                    </div>
                                </td>
                                <td class="pe-4">
                                    <div class="btn-group">
                                        <form th:action="@{/admin/confirmar/{id}(id=${r.id})}" method="post">
                                            <button class="btn btn-sm btn-outline-success border-0" title="Confirmar"><i class="fas fa-check"></i></button>
                                        </form>
                                        <form th:action="@{/admin/eliminar/{id}(id=${r.id})}" method="post">
                                            <button class="btn btn-sm btn-outline-danger border-0" title="Eliminar" onclick="return confirm('¿Eliminar reserva?')">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(reservas)}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <i class="fas fa-info-circle d-block mb-2 fa-2x"></i>
                                    No hay reservas para la fecha seleccionada.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('fechaFiltro').min = new Date().toISOString().split("T")[0];
</script>
<script th:src="@{/js/main.js}" defer></script>
</body>
</html>
